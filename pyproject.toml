[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarnexus"
version = "0.1.0"
description = "Motor de despacho energético predictivo (modelo 3P ASHRAE), peak shaving y red mesh DC para el campus UAM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
solarnexus = "solarnexus.__main__:main"
solarnexus-web = "solarnexus.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solarnexus = ["indicadores_uam.json", "web/estatico/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
