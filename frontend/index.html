<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SolarNexus · Dashboard</title>
    <script>
      // Aplica el tema elegido (claro/oscuro) antes de pintar, para evitar un parpadeo.
      try {
        const tema = localStorage.getItem('solarnexus-tema')
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema
      } catch { /* sin localStorage: se usa el tema del sistema */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
